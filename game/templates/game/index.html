<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chain Reaction Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        #info-panel {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            align-items: center;
        }
        .status-box {
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            border: 1px solid #334155;
        }
        #player-badge {
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
        }
        #gameCanvas {
            background-color: #020617;
            border: 3px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            cursor: pointer;
        }
        button {
            margin-top: 16px;
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        button:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <h1>Chain Reaction</h1>
    <div id="info-panel">
        <div class="status-box">Turn: <span id="player-badge">Player 1</span></div>
        <button onclick="resetGame()">Reset Game</button>
    </div>

    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const badge = document.getElementById('player-badge');

        const ROWS = 10;
        const COLS = 8;
        const CELL_WIDTH = canvas.width / COLS;
        const CELL_HEIGHT = canvas.height / ROWS;

        const PLAYERS = [
            { id: 1, name: 'Player 1 (Red)', color: '#ef4444' },
            { id: 2, name: 'Player 2 (Green)', color: '#22c55e' }
        ];

        let currentPlayerIndex = 0;
        let grid = [];
        let isAnimating = false;
        let totalTurns = 0;

        function initGrid() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                for (let c = 0; c < COLS; c++) {
                    let critical = 4;
                    if ((r === 0 || r === ROWS - 1) && (c === 0 || c === COLS - 1)) {
                        critical = 2; // Corners
                    } else if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1) {
                        critical = 3; // Edges
                    }
                    row.push({ count: 0, player: null, critical: critical });
                }
                grid.push(row);
            }
        }

        function updateBadge() {
            const current = PLAYERS[currentPlayerIndex];
            badge.innerText = current.name;
            badge.style.color = current.color;
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1.5;
            for (let r = 0; r <= ROWS; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * CELL_HEIGHT);
                ctx.lineTo(canvas.width, r * CELL_HEIGHT);
                ctx.stroke();
            }
            for (let c = 0; c <= COLS; c++) {
                ctx.beginPath();
                ctx.moveTo(c * CELL_WIDTH, 0);
                ctx.lineTo(c * CELL_WIDTH, canvas.height);
                ctx.stroke();
            }

            // Draw orbs
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = grid[r][c];
                    if (cell.count > 0 && cell.player !== null) {
                        drawOrbs(r, c, cell.count, cell.player.color);
                    }
                }
            }
        }

        function drawOrbs(r, c, count, color) {
            const centerX = c * CELL_WIDTH + CELL_WIDTH / 2;
            const centerY = r * CELL_HEIGHT + CELL_HEIGHT / 2;
            const radius = 10;

            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10;

            if (count === 1) {
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fill();
            } else if (count === 2) {
                ctx.beginPath();
                ctx.arc(centerX - 6, centerY, radius - 2, 0, Math.PI * 2);
                ctx.arc(centerX + 6, centerY, radius - 2, 0, Math.PI * 2);
                ctx.fill();
            } else if (count === 3) {
                ctx.beginPath();
                ctx.arc(centerX, centerY - 6, radius - 2, 0, Math.PI * 2);
                ctx.arc(centerX - 6, centerY + 5, radius - 2, 0, Math.PI * 2);
                ctx.arc(centerX + 6, centerY + 5, radius - 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.shadowBlur = 0; // Reset shadow
        }

        canvas.addEventListener('click', (e) => {
            if (isAnimating) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const col = Math.floor(x / CELL_WIDTH);
            const row = Math.floor(y / CELL_HEIGHT);

            handleMove(row, col);
        });

        async function handleMove(r, c) {
            const cell = grid[r][c];
            const activePlayer = PLAYERS[currentPlayerIndex];

            // Invalid move if occupied by opponent
            if (cell.player !== null && cell.player.id !== activePlayer.id) {
                return;
            }

            cell.count += 1;
            cell.player = activePlayer;
            totalTurns++;

            drawBoard();
            await processExplosions();

            // Next turn
            currentPlayerIndex = (currentPlayerIndex + 1) % PLAYERS.length;
            updateBadge();
            checkWinner();
        }

        async function processExplosions() {
            isAnimating = true;
            let unstableFound = true;

            while (unstableFound) {
                unstableFound = false;
                let cellsToExplode = [];

                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (grid[r][c].count >= grid[r][c].critical) {
                            cellsToExplode.push({ r, c, player: grid[r][c].player });
                            unstableFound = true;
                        }
                    }
                }

                if (unstableFound) {
                    await new Promise(res => setTimeout(res, 120)); // Delay for smooth animation

                    for (let item of cellsToExplode) {
                        const { r, c, player } = item;
                        grid[r][c].count -= grid[r][c].critical;
                        if (grid[r][c].count === 0) {
                            grid[r][c].player = null;
                        }

                        const neighbors = [
                            { r: r - 1, c: c },
                            { r: r + 1, c: c },
                            { r: r, c: c - 1 },
                            { r: r, c: c + 1 }
                        ];

                        for (let n of neighbors) {
                            if (n.r >= 0 && n.r < ROWS && n.c >= 0 && n.c < COLS) {
                                grid[n.r][n.c].count += 1;
                                grid[n.r][n.c].player = player; // Convert color
                            }
                        }
                    }
                    drawBoard();
                }
            }
            isAnimating = false;
        }

        function checkWinner() {
            if (totalTurns < PLAYERS.length) return;

            const counts = {};
            PLAYERS.forEach(p => counts[p.id] = 0);

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c].player) {
                        counts[grid[r][c].player.id] += grid[r][c].count;
                    }
                }
            }

            const activeRemaining = PLAYERS.filter(p => counts[p.id] > 0);
            if (activeRemaining.length === 1) {
                alert(`🎉 ${activeRemaining[0].name} wins!`);
                resetGame();
            }
        }

        function resetGame() {
            initGrid();
            currentPlayerIndex = 0;
            totalTurns = 0;
            updateBadge();
            drawBoard();
        }

        // Initialize on load
        initGrid();
        updateBadge();
        drawBoard();
    </script>
</body>
</html>
