{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chain Reaction: Arcane Forest</title>
    <link rel="stylesheet" href="{% static 'game/css/style.css' %}">
</head>
<body>
    <div class="dynamic-bg"></div>
    <div class="dark-overlay"></div>
    <canvas id="snowCanvas"></canvas>

    <!-- HUD Overlay -->
    <div id="hud" class="glass-panel">
        <div class="turn-pill">
            <span id="current-player-dot" class="turn-dot"></span>
            <span id="current-player-name">Player 1</span>
        </div>
        <button class="btn-secondary" onclick="location.reload()">Exit Game</button>
    </div>

    <!-- Responsive Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Lobby Setup Modal -->
    <div id="lobby-modal" class="glass-panel">
        <h1>CHAIN REACTION</h1>
        <p class="subtitle">Arcane Forest Edition</p>

        <!-- Grid Size Preset Selector -->
        <div class="form-group">
            <label for="grid-size-select">Realm Arena Size</label>
            <select id="grid-size-select">
                <option value="auto" selected>Auto Detect (Mobile Portrait / Desktop Landscape)</option>
                <option value="small">Small Arena (6 × 4 / 4 × 6)</option>
                <option value="standard">Standard Arena (9 × 6 / 6 × 9)</option>
                <option value="large">Grand Battlefield (12 × 8 / 8 × 12)</option>
                <option value="square">Square Colosseum (8 × 8)</option>
                <option value="titan">Titan Arena (16 × 16)</option>
                <option value="open">Open World(20 × 8)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="player-count-select">Number of Players</label>
            <select id="player-count-select" onchange="renderLobbyPlayerList()">
                <option value="2" selected>2 Players</option>
                <option value="3">3 Players</option>
                <option value="4">4 Players</option>
                <option value="5">5 Players</option>
                <option value="6">6 Players</option>
                <option value="7">7 Players</option>
                <option value="8">8 Players</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ai-difficulty">AI Difficulty</label>
            <select id="ai-difficulty">
                <option value="easy">Easy (Casual)</option>
                <option value="medium" selected>Medium (Tactical)</option>
                <option value="hard">Hard (Lookahead Minimax)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Player Slot Types</label>
            <div id="players-config-list"></div>
        </div>

        <button class="btn-primary" onclick="startNewGame()">START BATTLE</button>
    </div>

    <script src="{% static 'game/js/audio.js' %}"></script>
    <script src="{% static 'game/js/particles.js' %}"></script>
    <script src="{% static 'game/js/ai.js' %}"></script>
    <script src="{% static 'game/js/engine.js' %}"></script>

    <script>
        function renderLobbyPlayerList() {
            const count = parseInt(document.getElementById('player-count-select').value);
            const container = document.getElementById('players-config-list');
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const p = COLOR_PALETTE[i];
                const row = document.createElement('div');
                row.className = 'player-config-row';
                row.style.borderLeftColor = p.color;

                row.innerHTML = `
                    <span style="color: ${p.color};">${p.name}</span>
                    <select id="player-type-${i}">
                        <option value="human">Human</option>
                        <option value="ai" ${i > 0 ? 'selected' : ''}>CPU (AI)</option>
                    </select>
                `;
                container.appendChild(row);
            }
        }
        renderLobbyPlayerList();
    </script>
</body>
</html>
